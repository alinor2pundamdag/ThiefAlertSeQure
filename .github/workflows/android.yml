name: Android build and tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Name release candidate APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ThiefAlertSeQure-v1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThiefAlertSeQure-debug-apk
          path: ThiefAlertSeQure-v1.1.0.apk
          if-no-files-found: error
          retention-days: 14
