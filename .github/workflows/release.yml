name: Official signed Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish permanent-key APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source and release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restrict manual signed preflight to trusted release branches
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/heads/fix/android-compatibility-instrumentation" ]]; then
            echo "::error::Manual signed preflight is allowed only from main or the audited compatibility branch. Current ref: $GITHUB_REF"
            exit 1
          fi
          echo "Manual signed preflight is running from an approved branch; workflow_dispatch never publishes a GitHub Release."

      - name: Confirm tag points to main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Official releases must be tagged from a commit already merged into main."
            exit 1
          }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Require and verify permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!NAME:-}" ]]; then
              echo "::error::Missing required repository Actions secret: $NAME"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/thiefalertsequre-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          EXPECTED_CERT="9f4aa14a6c6fbca0dc10c7806858de9f050447953b93c5c99c6e6ea85f540b64"
          ACTUAL_CERT="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>&1 | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::Release keystore does not match the pinned official signing certificate."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          echo "Permanent release certificate verified."

      - name: Enforce release tag and monotonic version code
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -n 's/^val appVersionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -n 's/^val appVersionName = "\([^"]*\)"$/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Gradle version v$VERSION_NAME."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual release preflight only: build and verify the signed APK, but do not publish a GitHub Release."
          fi
          PREVIOUS_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_CODE="$(git show "$PREVIOUS_TAG:app/build.gradle.kts" | sed -n 's/^val appVersionCode = \([0-9][0-9]*\)$/\1/p' | head -n 1)"
            if [[ -z "$PREVIOUS_CODE" || "$VERSION_CODE" -le "$PREVIOUS_CODE" ]]; then
              echo "::error::versionCode $VERSION_CODE must be greater than the previous official release ($PREVIOUS_TAG, code ${PREVIOUS_CODE:-unknown})."
              exit 1
            fi
          fi
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "PREVIOUS_RELEASE_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
          echo "PREVIOUS_RELEASE_VERSION_CODE=$PREVIOUS_CODE" >> "$GITHUB_ENV"
          echo "Release version $VERSION_NAME ($VERSION_CODE) passed tag/version checks."
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run release lint
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/thiefalertsequre-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleRelease --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --stacktrace
          mkdir -p dist
          APK_NAME="ThiefAlertSeQure-v${APP_VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          echo "APK_PATH=dist/$APK_NAME" >> "$GITHUB_ENV"

      - name: Verify package, version, checksum and official signer
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$APK_PATH"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK_PATH")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 "^package:")"
          for EXPECTED in "name='com.thiefalertsequre.app'" "versionCode='$APP_VERSION_CODE'" "versionName='$APP_VERSION_NAME'"; do
            [[ "$PACKAGE_LINE" == *"$EXPECTED"* ]] || {
              echo "::error::APK metadata mismatch: expected $EXPECTED; got $PACKAGE_LINE"
              exit 1
            }
          done
          SIGNER_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH")"
          ACTUAL_CERT="$(printf '%s\n' "$SIGNER_OUTPUT" | sed -n 's/.*SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="9f4aa14a6c6fbca0dc10c7806858de9f050447953b93c5c99c6e6ea85f540b64"
          [[ "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || {
            echo "::error::APK signer does not match the pinned official release certificate."
            exit 1
          }
          sha256sum "$APK_PATH" > "$APK_PATH.sha256"
          cat "$APK_PATH.sha256"
          echo "Verified official APK: $PACKAGE_LINE"
          echo "Verified release signer: $ACTUAL_CERT"

      - name: Assemble release instrumentation test APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/thiefalert-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleReleaseAndroidTest --no-daemon --stacktrace

      - name: Verify previous official APK upgrades in place without losing private data
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            test -n "$PREVIOUS_RELEASE_TAG"
            PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
            mkdir -p "$PREVIOUS_DIR"
            gh release download "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "ThiefAlertSeQure-$PREVIOUS_RELEASE_TAG-release.apk*" --dir "$PREVIOUS_DIR"
            PREVIOUS_APK="$PREVIOUS_DIR/ThiefAlertSeQure-$PREVIOUS_RELEASE_TAG-release.apk"
            test -s "$PREVIOUS_APK"
            EXPECTED_OLD_SHA="$(awk '{print $1}' "$PREVIOUS_DIR/ThiefAlertSeQure-$PREVIOUS_RELEASE_TAG-release.apk.sha256")"
            ACTUAL_OLD_SHA="$(sha256sum "$PREVIOUS_APK" | cut -d' ' -f1)"
            [[ -n "$EXPECTED_OLD_SHA" && "$ACTUAL_OLD_SHA" == "$EXPECTED_OLD_SHA" ]] || {
              echo "::error::Previous official APK checksum verification failed."
              exit 1
            }
            BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            EXPECTED_CERT="9f4aa14a6c6fbca0dc10c7806858de9f050447953b93c5c99c6e6ea85f540b64"
            OLD_BADGING="$("$BUILD_TOOLS/aapt" dump badging "$PREVIOUS_APK")"
            OLD_PACKAGE_LINE="$(printf '%s\n' "$OLD_BADGING" | grep -m1 "^package:")"
            for EXPECTED in "name='com.thiefalertsequre.app'" "versionCode='$PREVIOUS_RELEASE_VERSION_CODE'" "versionName='${PREVIOUS_RELEASE_TAG#v}'"; do
              [[ "$OLD_PACKAGE_LINE" == *"$EXPECTED"* ]] || {
                echo "::error::Previous release APK mismatch: expected $EXPECTED; got $OLD_PACKAGE_LINE"
                exit 1
              }
            done
            OLD_CERT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$PREVIOUS_APK" | sed -n 's/.*SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
            [[ "$OLD_CERT" == "$EXPECTED_CERT" ]] || {
              echo "::error::Previous official APK signer differs from the pinned production certificate."
              exit 1
            }
            TEST_APK="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
            test -s "$TEST_APK"
            TEST_PACKAGE_LINE="$("$BUILD_TOOLS/aapt" dump badging "$TEST_APK" | grep -m1 "^package:")"
            [[ "$TEST_PACKAGE_LINE" == *"name='com.thiefalertsequre.app.test'"* ]] || {
              echo "::error::Unexpected release instrumentation package: $TEST_PACKAGE_LINE"
              exit 1
            }
            TEST_CERT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$TEST_APK" | sed -n 's/.*SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
            if [[ "$TEST_CERT" != "$EXPECTED_CERT" ]]; then
              echo "Re-signing the private regression test APK with the verified production certificate."
              UNSIGNED_TEST_APK="$RUNNER_TEMP/release-test-unsigned.apk"
              ALIGNED_TEST_APK="$RUNNER_TEMP/release-test-aligned.apk"
              SIGNED_TEST_APK="$RUNNER_TEMP/release-test-signed.apk"
              cp "$TEST_APK" "$UNSIGNED_TEST_APK"
              zip -q -d "$UNSIGNED_TEST_APK" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' || true
              "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_TEST_APK" "$ALIGNED_TEST_APK"
              "$BUILD_TOOLS/apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" \
                --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
                --out "$SIGNED_TEST_APK" "$ALIGNED_TEST_APK"
              cp "$SIGNED_TEST_APK" "$TEST_APK"
              TEST_CERT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$TEST_APK" | sed -n 's/.*SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
            fi
            [[ "$TEST_CERT" == "$EXPECTED_CERT" ]] || {
              echo "::error::Unable to sign release instrumentation APK with the official certificate."
              exit 1
            }
            adb install "$PREVIOUS_APK"
            adb install -t "$TEST_APK"
            TEST_RUNNER="com.thiefalertsequre.app.test/androidx.test.runner.AndroidJUnitRunner"
            TEST_CLASS="com.thiefalertsequre.app.AndroidCompatibilitySmokeTest#upgradeDataCanBeSeededOrVerifiedAcrossPackageReplacement"
            adb shell am instrument -w -r -e class "$TEST_CLASS" -e upgradePhase seed "$TEST_RUNNER"
            adb install -r "$APK_PATH"
            adb shell am instrument -w -r -e class "$TEST_CLASS" -e upgradePhase verify "$TEST_RUNNER"
            NEW_BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK_PATH")"
            NEW_PACKAGE_LINE="$(printf '%s\n' "$NEW_BADGING" | grep -m1 "^package:")"
            for EXPECTED in "name='com.thiefalertsequre.app'" "versionCode='$APP_VERSION_CODE'" "versionName='$APP_VERSION_NAME'"; do
              [[ "$NEW_PACKAGE_LINE" == *"$EXPECTED"* ]] || {
                echo "::error::Candidate APK mismatch: expected $EXPECTED; got $NEW_PACKAGE_LINE"
                exit 1
              }
            done
            echo "Verified in-place upgrade: $OLD_PACKAGE_LINE -> $NEW_PACKAGE_LINE"
            echo "Verified app-private SharedPreferences survived adb install -r without uninstall."

      - name: Upload signed release preflight artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ThiefAlertSeQure-v${{ env.APP_VERSION_NAME }}-release-preflight
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Publish GitHub Release with APK and SHA-256 file
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" "$APK_PATH.sha256" \
            --title "ThiefAlertSeQure $APP_VERSION_NAME" \
            --generate-notes
