name: Official signed Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish permanent-key APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source and release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm tag points to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Official releases must be tagged from a commit already merged into main."
            exit 1
          }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Require and verify permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!NAME:-}" ]]; then
              echo "::error::Missing required repository Actions secret: $NAME"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/thiefalertsequre-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          EXPECTED_CERT="9f4aa14a6c6fbca0dc10c7806858de9f050447953b93c5c99c6e6ea85f540b64"
          ACTUAL_CERT="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>&1 | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo "::error::Release keystore does not match the pinned official signing certificate."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          echo "Permanent release certificate verified."

      - name: Enforce release tag and monotonic version code
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -n 's/^val appVersionCode = \([0-9][0-9]*\)$/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -n 's/^val appVersionName = "\([^"]*\)"$/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Gradle version v$VERSION_NAME."
            exit 1
          fi
          PREVIOUS_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_CODE="$(git show "$PREVIOUS_TAG:app/build.gradle.kts" | sed -n 's/^val appVersionCode = \([0-9][0-9]*\)$/\1/p' | head -n 1)"
            if [[ -z "$PREVIOUS_CODE" || "$VERSION_CODE" -le "$PREVIOUS_CODE" ]]; then
              echo "::error::versionCode $VERSION_CODE must be greater than the previous official release ($PREVIOUS_TAG, code ${PREVIOUS_CODE:-unknown})."
              exit 1
            fi
          fi
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Release version $VERSION_NAME ($VERSION_CODE) passed tag/version checks."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run release lint
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/thiefalertsequre-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleRelease --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks --stacktrace
          mkdir -p dist
          APK_NAME="ThiefAlertSeQure-v${APP_VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          echo "APK_PATH=dist/$APK_NAME" >> "$GITHUB_ENV"

      - name: Verify package, version, checksum and official signer
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -s "$APK_PATH"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK_PATH")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 "^package:")"
          for EXPECTED in "name='com.thiefalertsequre.app'" "versionCode='$APP_VERSION_CODE'" "versionName='$APP_VERSION_NAME'"; do
            [[ "$PACKAGE_LINE" == *"$EXPECTED"* ]] || {
              echo "::error::APK metadata mismatch: expected $EXPECTED; got $PACKAGE_LINE"
              exit 1
            }
          done
          SIGNER_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH")"
          ACTUAL_CERT="$(printf '%s\n' "$SIGNER_OUTPUT" | sed -n 's/.*SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="9f4aa14a6c6fbca0dc10c7806858de9f050447953b93c5c99c6e6ea85f540b64"
          [[ "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || {
            echo "::error::APK signer does not match the pinned official release certificate."
            exit 1
          }
          sha256sum "$APK_PATH" > "$APK_PATH.sha256"
          cat "$APK_PATH.sha256"
          echo "Verified official APK: $PACKAGE_LINE"
          echo "Verified release signer: $ACTUAL_CERT"

      - name: Publish GitHub Release with APK and SHA-256 file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" "$APK_PATH.sha256" \
            --title "ThiefAlertSeQure $APP_VERSION_NAME" \
            --generate-notes
